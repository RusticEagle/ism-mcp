name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). If empty, uses package.json version."
        required: false
        type: string
      deploy_cloudflare:
        description: "Deploy static site to Cloudflare Workers"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG)"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bundle ISM data (online)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run rebundle

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          npm pack
          TGZ=$(ls ism-mcp-*.tgz | head -n1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        run: |
          sha256sum ${{ steps.pack.outputs.tgz }} > ${{ steps.pack.outputs.tgz }}.sha256
          cat ${{ steps.pack.outputs.tgz }}.sha256

      - name: Generate release notes
        id: notes
        run: |
          {
            echo "## ism-mcp ${GITHUB_REF_NAME:-manual}"
            echo
            echo "Offline-capable MCP server for the ACSC Information Security Manual."
            echo
            echo "### Bundle contents"
            node -e "const m=require('./data/index.json');console.log('- '+m.versions.length+' ISM releases (latest: '+m.versions[0].id+', oldest: '+m.versions[m.versions.length-1].id+')');console.log('- Source: '+m.source);console.log('- Bundled at: '+m.generatedAt);"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pack.outputs.tgz }}"
            echo "npm install -g ./${{ steps.pack.outputs.tgz }}"
            echo "ism-mcp"
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.pack.outputs.tgz }}
            ${{ steps.pack.outputs.tgz }}.sha256
            data/index.json

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  deploy-cloudflare-workers:
    name: Deploy Cloudflare Workers
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_cloudflare != 'false')
    steps:
      - name: Check Cloudflare credentials
        id: cfcreds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set; skipping Workers deploy."
          fi

      - uses: actions/checkout@v6
        if: steps.cfcreds.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.cfcreds.outputs.configured == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.cfcreds.outputs.configured == 'true'
        run: npm ci

      - name: Rebuild bundled data and site
        if: steps.cfcreds.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run rebundle
          npm run build
          npm pack
          npm run site

      - name: Deploy to Cloudflare Workers
        if: steps.cfcreds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # The container image build + Azure deployment is handled by azure-deploy.yml,
  # which is also triggered on tag push.
