name: Sync Upstream ISM Releases

"on":
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Detect new upstream ISM release
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const headers = {
            Accept: 'application/vnd.github+json',
            'User-Agent': 'ism-mcp-upstream-sync',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          if (process.env.GITHUB_TOKEN) {
            headers.Authorization = `Bearer ${process.env.GITHUB_TOKEN}`;
          }

          async function main() {
            const res = await fetch('https://api.github.com/repos/AustralianCyberSecurityCentre/ism-oscal/tags?per_page=1&page=1', { headers });
            if (!res.ok) {
              throw new Error(`Failed to fetch upstream tags: HTTP ${res.status}`);
            }

            const tags = await res.json();
            const upstream = tags[0]?.name ?? '';
            const localIndex = JSON.parse(fs.readFileSync('data/index.json', 'utf8'));
            const local = localIndex.versions?.[0]?.tag ?? '';
            const changed = Boolean(upstream && upstream !== local);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `upstream_tag=${upstream}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `local_tag=${local}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Stop when no new release exists
        if: steps.detect.outputs.changed != 'true'
        run: |
          echo "No new upstream ISM release detected."
          echo "Local:    ${{ steps.detect.outputs.local_tag }}"
          echo "Upstream: ${{ steps.detect.outputs.upstream_tag }}"

      - name: Rebundle ISM data
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run rebundle

      - name: Bump package version
        if: steps.detect.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Commit synced release
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data package.json package-lock.json
          git commit -m "chore: sync upstream ISM ${{ steps.detect.outputs.upstream_tag }}"

      - name: Push to main
        if: steps.detect.outputs.changed == 'true'
        run: git push origin HEAD:main
